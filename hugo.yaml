baseURL: "https://dsamuelhodge.github.io/cos-site/"
title: Derrick Hodge
defaultContentLanguage: en
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

outputs:
  home: [html, rss, json]
  page: [html, markdown, json]
  section: [html, rss, markdown, json]
  taxonomy: [html, rss, json]
  term: [html, rss, json]

caches:
  images:
    dir: :cacheDir/images

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - identifier: life
      name: Life
      pageRef: /life
      weight: 1
    - identifier: people
      name: People
      pageRef: /life/people
      parent: life
      weight: 1
    - identifier: ops
      name: Operations
      pageRef: /life/ops
      parent: life
      weight: 2
    - identifier: focus
      name: Focus
      pageRef: /life/focus
      parent: life
      weight: 3
    - identifier: education
      name: Education
      pageRef: /life/education
      parent: life
      weight: 4
    - identifier: work
      name: Work
      pageRef: /work
      weight: 2
    - identifier: projects
      name: Projects
      pageRef: /work/projects
      parent: work
      weight: 1
    - identifier: tasks
      name: Tasks
      pageRef: /work/tasks
      parent: work
      weight: 2
    - identifier: commitments
      name: Commitments
      pageRef: /work/commitments
      parent: work
      weight: 3
    - identifier: notes
      name: Notes
      pageRef: /notes
      weight: 3
    - identifier: decisions
      name: Decisions
      pageRef: /notes/decisions
      parent: notes
      weight: 1
    - name: Search
      weight: 8
      params:
        type: search
    - name: GitHub
      weight: 9
      url: "https://github.com/DSamuelHodge/cos-site"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    displayCopyright: false
    displayPoweredBy: true
  displayUpdatedAuthor: true
  page:
    contextMenu:
      enable: true
