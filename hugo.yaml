baseURL: "https://dsamuelhodge.github.io/cos-site/"
title: CoS
defaultContentLanguage: en
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

outputs:
  home: [html, rss, json]
  page: [html, markdown, json]
  section: [html, rss, markdown, json]
  taxonomy: [html, rss, json]
  term: [html, rss, json]

caches:
  images:
    dir: :cacheDir/images

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Briefings
      pageRef: /briefings
      weight: 1
    - name: Docs
      pageRef: /docs
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: "https://github.com/DSamuelHodge/cos-site"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    displayCopyright: false
    displayPoweredBy: true
  displayUpdatedAuthor: true
  page:
    contextMenu:
      enable: true
