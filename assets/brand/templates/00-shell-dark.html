<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Email Template</title>
<style>
  :root {
    --canvas: #f7f5f0;
    --canvas-soft: #383330;
    --hairline: #3f3a36;
    --ink: #f7f5f0;
    --body-strong: #dad2c1;
    --body: #c9c0ad;
    --mute: #aea69c;
  }
  body {
    margin: 0; padding: 0; background: var(--canvas); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; line-height: 1.5; color: var(--body); font-size: 14px;
  }
  .email-wrapper { max-width: 600px; margin: 20px auto; background: white; border: 1px solid var(--hairline); border-radius: 4px; overflow: hidden; }
  .nav-bar { background: white; padding: 16px 28px; border-bottom: 1px solid var(--hairline); display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 600; color: var(--ink); }
  .nav-bar a { color: var(--body-strong); text-decoration: none; }
  .content { padding: 32px 28px; background: var(--canvas); }
  .card { background: var(--canvas-soft); border: 1px solid var(--hairline); border-radius: 4px; padding: 24px; margin: 24px 0; }
  .btn-primary { display: inline-block; background: var(--ink); color: var(--canvas); padding: 8px 20px; border-radius: 3px; font-weight: 500; text-decoration: none; font-size: 14px; }
  .btn-ghost { display: inline-block; background: transparent; color: var(--ink); padding: 8px 20px; border: 1px solid var(--hairline); border-radius: 3px; font-weight: 500; text-decoration: none; font-size: 14px; margin-left: 8px; }
  .mono-block { font-family: 'DM Mono', 'SFMono-Regular', Consolas, monospace; font-size: 13px; background: var(--canvas-soft); border: 1px solid var(--hairline); border-radius: 4px; padding: 12px; }
  .hairline { height: 1px; background: var(--hairline); margin: 32px 0; }
  .signature { margin-top: 24px; }
</style>
</head>
<body>
<div class="email-wrapper">
  <!-- nav-bar -->
  <div class="nav-bar">
    <div>Derrick Hodge</div>
    <a href="{{view_in_browser_url}}">View in browser</a>
  </div>
  
  <div class="content">
    <!-- Template content goes here (cards, mono-blocks, buttons, etc.) -->
    <p>Template content placeholder. Replace with specific card / status / CTA layout per use case.</p>
    
    <!-- hairline divider -->
    <div class="hairline"></div>
    
    <!-- signature -->
    <div class="signature">
      <!-- insert signature-snippet.html content here -->
      <div style="margin: 32px 0; padding: 24px 0; border-top: 1px solid #3f3a36; border-bottom: 1px solid #3f3a36; color: #c9c0ad; font-size: 14px; line-height: 1.7;">
        <div style="font-weight: 600; color: #dad2c1; font-size: 15px; margin-bottom: 2px;">Derrick Hodge</div>
        <div style="margin-bottom: 8px;">Founder & Owner</div>
        <div>
          <a href="mailto:hodge@agentmail.to" style="color: #dad2c1; text-decoration: none;">hodge@agentmail.to</a> • 
          <a href="tel:+15551234567" style="color: #dad2c1; text-decoration: none;">+1 (555) 123-4567</a> • 
          <a href="https://dsamuelhodge.com" style="color: #dad2c1; text-decoration: none;">dsamuelhodge.com</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
