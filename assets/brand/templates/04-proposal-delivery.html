<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>General Proposal Delivery</title>
<style>
  :root {
    --canvas: #f7f5f0;
    --canvas-soft: #efe9de;
    --hairline: #e3ddd2;
    --ink: #2b2622;
    --body-strong: #453e35;
    --body: #6f6759;
    --mute: #948c7d;
  }
  body { margin:0; padding:0; background:var(--canvas); font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; line-height:1.5; color:var(--body); font-size:14px; }
  .email-wrapper { max-width:600px; margin:20px auto; background:white; border:1px solid var(--hairline); border-radius:4px; overflow:hidden; }
  .nav-bar { background:white; padding:16px 28px; border-bottom:1px solid var(--hairline); display:flex; justify-content:space-between; align-items:center; font-size:15px; font-weight:600; color:var(--ink); }
  .nav-bar a { color:var(--body-strong); text-decoration:none; }
  .content { padding:32px 28px; background:var(--canvas); }
  .card { background:var(--canvas-soft); border:1px solid var(--hairline); border-radius:4px; padding:24px; margin:24px 0; }
  .btn-primary { display:inline-block; background:var(--ink); color:var(--canvas); padding:8px 20px; border-radius:3px; font-weight:500; text-decoration:none; font-size:14px; }
  .btn-ghost { display:inline-block; background:transparent; color:var(--ink); padding:8px 20px; border:1px solid var(--hairline); border-radius:3px; font-weight:500; text-decoration:none; font-size:14px; margin-left:8px; }
  .mono-block { font-family:'DM Mono','SFMono-Regular',Consolas,monospace; font-size:13px; background:var(--canvas-soft); border:1px solid var(--hairline); border-radius:4px; padding:12px; display:inline-block; margin:12px 0; }
  .hairline { height:1px; background:var(--hairline); margin:32px 0; }
</style>
</head>
<body>
<div class="email-wrapper">
  <div class="nav-bar">
    <div>Derrick Hodge</div>
    <a href="#">View in browser</a>
  </div>
  <div class="content">
    <h2 style="font-size:20px; color:var(--ink); margin-top:0;">Proposal Delivery</h2>
    <div class="card">
      <p style="color:var(--body);">Q3 strategy proposal attached for your review and signature.</p>
      <div class="mono-block">Aug 28 • 10:00 AM • Zoom</div>
    </div>
    <a href="#" class="btn-primary">Open Proposal</a>
    <a href="#" class="btn-ghost">Reschedule</a>
    <div class="hairline"></div>
    <!-- signature-snippet -->
    <div style="margin:32px 0; padding:24px 0; border-top:1px solid #e3ddd2; border-bottom:1px solid #e3ddd2; color:#6f6759; font-size:14px; line-height:1.7;">
      <div style="font-weight:600; color:#453e35; font-size:15px; margin-bottom:2px;">Derrick Hodge</div>
      <div style="margin-bottom:8px;">Founder & Owner</div>
      <div>
        <a href="mailto:hodge@agentmail.to" style="color:#453e35; text-decoration:none;">hodge@agentmail.to</a> • 
        +1 (555) 123-4567 • 
        <a href="https://dsamuelhodge.com" style="color:#453e35; text-decoration:none;">dsamuelhodge.com</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
