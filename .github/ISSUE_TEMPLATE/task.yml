name: Task
description: One executable unit. Kaneo createTask fields plus CoS dispatch.
title: "[task] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Canonical contract: `data/schemas/task.yaml`.
        Kaneo `POST /task/{projectId}` requires title, description, priority, status.
        Do not put phones, SMS, or secrets in the issue body.
  - type: dropdown
    id: type
    attributes:
      label: type
      options:
        - task
      default: 0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: description
      description: Kaneo description (required). Public-safe. What done looks like in one paragraph.
    validations:
      required: true
  - type: input
    id: projectId
    attributes:
      label: projectId
      description: Kaneo project id (path param). Empty only if the Kaneo project does not exist yet.
  - type: input
    id: parent
    attributes:
      label: parent
      description: Parent project GitHub issue number.
      placeholder: "12"
  - type: dropdown
    id: priority
    attributes:
      label: priority
      options:
        - no-priority
        - low
        - medium
        - high
        - urgent
      default: 0
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: status
      description: Kaneo column slug. Default board uses these four.
      options:
        - todo
        - in-progress
        - blocked
        - done
      default: 0
    validations:
      required: true
  - type: input
    id: startDate
    attributes:
      label: startDate
      description: ISO 8601 or empty.
      placeholder: "2026-08-24"
  - type: input
    id: dueDate
    attributes:
      label: dueDate
      description: ISO 8601 or empty.
      placeholder: "2026-08-31"
  - type: input
    id: goal
    attributes:
      label: goal
      description: Which personal or professional goal this serves.
    validations:
      required: true
  - type: dropdown
    id: assignee_kind
    attributes:
      label: assignee_kind
      options:
        - cos
        - kaneo
        - linear
        - other-agent
      default: 0
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: acceptance
      description: Checkbox list. Task is done when these are true.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: links
      description: Fill after sync.
      value: |
        site:
        github:
        kaneo:
        linear:
