name: Project
description: Bounded outcome. Kaneo createProject fields plus CoS dispatch.
title: "[project] "
labels: ["project"]
body:
  - type: markdown
    attributes:
      value: |
        Canonical contract: `data/schemas/project.yaml`.
        Kaneo `POST /project` requires name, workspaceId, icon, slug.
        Site pages under `/work/projects` are public indexes — no secrets.
  - type: dropdown
    id: type
    attributes:
      label: type
      options:
        - project
      default: 0
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: name
      description: Kaneo project name. Same as the issue title without the [project] prefix.
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: slug
      description: Kaneo URL slug. Lowercase, hyphenated.
    validations:
      required: true
  - type: input
    id: icon
    attributes:
      label: icon
      description: Kaneo icon. Default folder.
      placeholder: folder
      value: folder
    validations:
      required: true
  - type: input
    id: workspaceId
    attributes:
      label: workspaceId
      description: Kaneo workspace id. Leave empty if Kaneo has not created it yet.
  - type: textarea
    id: description
    attributes:
      label: description
      description: Kaneo description. Public-safe. One or two sentences.
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: parent
      description: Parent GitHub issue number, if this project sits under another.
      placeholder: "12"
  - type: input
    id: goal
    attributes:
      label: goal
      description: Which personal or professional goal this serves.
    validations:
      required: true
  - type: dropdown
    id: assignee_kind
    attributes:
      label: assignee_kind
      options:
        - cos
        - kaneo
        - linear
        - other-agent
      default: 0
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: status
      description: Board column slug. Create the same columns in Kaneo.
      options:
        - todo
        - in-progress
        - blocked
        - done
      default: 0
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: priority
      options:
        - no-priority
        - low
        - medium
        - high
        - urgent
      default: 0
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: acceptance
      description: Checkbox list. Project is done when these are true.
      value: |
        - [ ] Outcome is shipped or explicitly dropped
        - [ ] Child tasks are closed or moved
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: links
      description: Fill after sync.
      value: |
        site:
        github:
        kaneo:
        linear:
